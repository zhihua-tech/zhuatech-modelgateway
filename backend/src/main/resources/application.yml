spring:
 application: {name: zhuatech-modelgateway}
 datasource:
  url: ${DB_URL:jdbc:mysql://localhost:3306/zhuatech_modelgateway?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
  username: ${DB_USERNAME:zhuatech}
  password: ${DB_PASSWORD:zhuatech_dev_password}
 jpa: {open-in-view: false, hibernate: {ddl-auto: validate}}
 flyway: {enabled: true}
app:
 security:
  admin-password: ${APP_ADMIN_PASSWORD:zhuatech-demo-admin}
  auditor-password: ${APP_AUDITOR_PASSWORD:zhuatech-demo-auditor}
model:
 api-key: ${MODEL_API_KEY:}
 allowed-hosts: ${MODEL_ALLOWED_HOSTS:api.deepseek.com,api.openai.com}
